name: Convert File

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Create folders
        run: mkdir -p input output

      - name: Convert file
        run: |
          soffice --headless --convert-to pdf input/input.docx --outdir output

      - name: Upload result
        uses: actions/upload-artifact@v3
        with:
          name: converted
          path: output/
